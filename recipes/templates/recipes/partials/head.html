<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/fontawesome.min.css"
        integrity="sha512-M5Kq4YVQrjg5c2wsZSn27Dkfm/2ALfxmun0vUE3mPiJyK53hQBHYCVAtvMYEC7ZXmYLg8DVG4tF8gD27WmDbsg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/brands.min.css"
        integrity="sha512-WxpJXPm/Is1a/dzEdhdaoajpgizHQimaLGL/QqUIAjIihlQqlPQb1V9vkGs9+VzXD7rgI6O+UsSKl4u5K36Ydw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/solid.min.css"
        integrity="sha512-EHa6vH03/Ty92WahM0/tet1Qicl76zihDCkBnFhN3kFGQkC+mc86d7V+6y2ypiLbk3h0beZAGdUpzfMcb06cMg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&display=swap" rel="stylesheet">
    <title>Recipes</title>

    <style>
        :root {
            --color-primary: #269fe6;
            --color-primary-hover: #2086c2;
            --color-primary-dark: #0f172a;
            --color-primary-dark-hover: #1e293b;
            --color-primary-light: #dbeafe;
            --color-primary-light-hover: #bfdbfe;

            --color-white: #ffffff;
            --color-black: #000000;

            --color-dark-text: #1f2937;

            --color-gray-0: #f9fafb;
            --color-gray-1: #f3f4f6;
            --color-gray-2: #e5e7eb;
            --color-gray-3: #d1d5db;
            --color-gray-4: #9ca3af;
            --color-gray-5: #6b7280;
            --color-gray-6: #4b5563;
            --color-gray-7: #374151;
            --color-gray-8: #1f2937;
            --color-gray-9: #111827;

            --font-primary: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-headings: 'Roboto Slab', serif;

            --spacing-gutter-medium: 2.4rem;
            --spacing-gutter-large: 3.2rem;
        }

        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
        }

        body {
            font-size: 1.6rem;
            font-family: var(--font-primary);
            background: var(--color-gray-1);
            color: var(--color-dark-text);
            line-height: 1.6;
        }

        /* HEADINGS */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-headings);
            color: var(--color-gray-9);
        }

        /* CONTAINER */
        .container {
            max-width: 120rem;
            margin: 0 auto;
            padding: var(--spacing-gutter-medium);
        }

        /* HEADER */
        .main-header-container {
            background: linear-gradient(90deg, #0f172a, #020617);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
        }

        .main-logo {
            font-size: 3.6rem;
            color: var(--color-white);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: fit-content;
            margin: 0 auto;
        }

        .main-logo-icon {
            color: var(--color-primary);
        }

        /* SEARCH */
        .search-form {
            border: 1px solid var(--color-gray-3);
            max-width: 64rem;
            margin: 2rem auto 0;
            border-radius: 1.2rem;
            position: relative;
            background: var(--color-white);
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: all 300ms ease;
        }

        .search-input,
        .search-button {
            border: none;
            background: none;
            outline: none;
            padding: 1.2rem 1.6rem;
        }

        .search-input {
            width: 100%;
            font-size: 1.5rem;
        }

        .search-button {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--color-gray-5);
        }

        .search-form:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(38, 159, 230, .2);
        }

        .search-form:focus-within .search-button {
            color: var(--color-primary);
        }

        /* GRID */
        .main-content-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: var(--spacing-gutter-large);
        }

        /* CARDS */
        .recipe {
            background: var(--color-white);
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            transition: transform 300ms ease, box-shadow 300ms ease;
        }

        .recipe:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .15);
        }

        .recipe-title-container {
            padding: var(--spacing-gutter-medium);
        }

        .recipe-author {
            padding: 0 var(--spacing-gutter-medium);
            color: var(--color-gray-5);
        }

        .recipe-author a {
            color: var(--color-primary);
            text-decoration: none;
        }

        .recipe-content {
            padding: var(--spacing-gutter-medium);
        }

        .recipe-meta-container {
            display: flex;
            background: var(--color-gray-0);
            padding: var(--spacing-gutter-medium);
        }

        .recipe-meta {
            flex: 1;
            text-align: center;
        }

        .recipe-footer a {
            background: linear-gradient(90deg, var(--color-primary), var(--color-primary-hover));
            display: block;
            color: var(--color-white);
            text-decoration: none;
            text-align: center;
            padding: 1.4rem;
            font-weight: 600;
            transition: filter 300ms ease;
        }

        .recipe-footer a:hover {
            filter: brightness(1.1);
        }

        /* FOOTER */
        .main-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #020617, #0f172a);
            color: var(--color-white);
            padding: var(--spacing-gutter-large);
            border-top: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, .5);
        }

        .main-footer a {
            color: var(--color-white);
            text-decoration: none;
            font-weight: 500;
            opacity: .8;
            transition: opacity 300ms ease, transform 300ms ease;
        }

        .main-footer a:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        .main-footer .powered a {
            font-size: 1.3rem;
            opacity: .6;
        }
    </style>


</head>
